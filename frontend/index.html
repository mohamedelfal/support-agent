<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 وكيل الذكاء الاصطناعي</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>🧠 وكيل الذكاء الاصطناعي</h1>
            <p>اسألني أي شيء وسأجيبك</p>
        </header>

        <main>
            <!-- قسم تسجيل الدخول -->
            <section id="login-section">
                <h2>🔑 تسجيل الدخول</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" placeholder="example@email.com" required />
                    </div>
                    <button type="submit" id="loginSubmit">دخول</button>
                    <div id="loginMessage"></div>
                </form>
            </section>

            <!-- قسم الشات (يظهر بعد تسجيل الدخول) -->
            <section id="chat-section" style="display:none;">
                <div id="user-info">
                    <span id="userEmailDisplay"></span>
                    <button id="logoutBtn">🚪 خروج</button>
                </div>
                <div id="messages"></div>
                <div id="input-area">
                    <input type="text" id="questionInput" placeholder="اكتب سؤالك هنا..." />
                    <button id="sendBtn">📨 إرسال</button>
                </div>
            </section>

            <!-- المحادثات السابقة -->
            <section id="history-section" style="display:none;">
                <h2>📜 المحادثات السابقة</h2>
                <div id="history-list"></div>
            </section>
        </main>

        <footer>
            <p>🚀 يعمل على Cloudflare Workers AI + D1 | <a href="#">GitHub</a></p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
