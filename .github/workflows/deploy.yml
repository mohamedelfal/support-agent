name: Deploy Worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # إنشاء Agent Memory Namespace تلقائياً
      - name: Create Agent Memory Namespace
        run: |
          echo "Creating Agent Memory Namespace: support-agent-memory"
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/agent_memory/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name": "support-agent-memory"}')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Namespace created successfully."
          else
            echo "⚠️ Namespace might already exist or an error occurred. Continuing..."
          fi
      
      # تثبيت الحزم (بما فيها الحزم الجديدة)
      - name: Install dependencies
        run: |
          cd worker
          npm install
          npm install --save-dev wrangler@4
      
      - run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
